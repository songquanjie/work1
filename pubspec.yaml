  provider: ^6.1.5
  path: ^1.9.1
  sqflite: ^2.4.2
  uuid: ^4.5.1
  http: ^1.2.2
  flutter_blue_plus: ^1.35.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
